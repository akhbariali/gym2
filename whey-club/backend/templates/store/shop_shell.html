<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} | وی کلاب</title><link rel="canonical" href="{{ canonical }}"><meta name="description" content="خرید و مقایسه {{ title }} در فروشگاه وی کلاب"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/blog.css"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">{% for css in entry.styles %}<link rel="stylesheet" href="{{ css }}">{% endfor %}</head><body><div id="root"><main class="wrap"><nav aria-label="دسته‌های محصولات"><a href="/shop/">همه محصولات</a>{% for c in categories %}<a href="{{ c.get_absolute_url }}">{{ c.name }}</a>{% endfor %}</nav><h1>{{ title }}</h1>{% for product in products %}<article><h2><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></h2><p>{{ product.selling_price }} تومان</p></article>{% empty %}<p>هنوز محصولی در این دسته موجود نیست.</p>{% endfor %}</main></div>{% if entry.src %}<script type="module" src="{{ entry.src }}"></script>{% endif %}</body></html>
