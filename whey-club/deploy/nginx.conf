worker_processes 1;
pid /run/whey-club/nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    client_body_temp_path /run/whey-club/client_temp;
    proxy_temp_path /run/whey-club/proxy_temp;
    fastcgi_temp_path /run/whey-club/fastcgi_temp;
    uwsgi_temp_path /run/whey-club/uwsgi_temp;
    scgi_temp_path /run/whey-club/scgi_temp;
    server {
        listen 8088;
        server_name _;
        root /opt/whey-club/site;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location / { try_files $uri $uri/ =404; }
        location ~ /\. { deny all; }
    }
}
