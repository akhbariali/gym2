        server_name _;
        root /opt/whey-club/site;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        absolute_redirect off;
        if ($request_uri ~ "^(.*/)index\.html(?:\?.*)?$") { return 301 $1$is_args$args; }
        if ($legacy_article != "") { return 301 $legacy_article$is_args$args; }
        location = /products/ { return 301 /shop/whey-protein/$is_args$args; }
        location /api/ {
            proxy_pass http://127.0.0.1:8089;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /react-entry.json { try_files $uri =404; }
        location / { try_files $uri $uri/ =404; }
        location ~ /\. { deny all; }
