services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: wheyclub
      POSTGRES_USER: wheyclub
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD for local development}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wheyclub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wheyclub -d wheyclub"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  wheyclub-postgres:
